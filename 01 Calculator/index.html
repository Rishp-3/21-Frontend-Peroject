<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="contener">
      <div class="con-ans">
      <div class="que"></div>
      <div class="ans"></div>
      </div>
      <div class="but">
        <button class="data c1" value="C">AC</button>
        <button class="data c1" value="⌫">⌫</button>
        <button class="data c1" value="%">%</button>
        <button class="data c2" value="/">/</button>
        <button class="data" value="7">7</button>
        <button class="data" value="8">8</button>
        <button class="data" value="9">9</button>
        <button class="data c2" value="X">X</button>
        <button class="data" value="4">4</button>
        <button class="data" value="5">5</button>
        <button class="data" value="6">6</button>
        <button class="data c2" value="-">-</button>
        <button class="data" value="1">1</button>
        <button class="data" value="2">2</button>
        <button class="data" value="3">3</button>
        <button class="data c2" value="+">+</button>
        <button class="data ze" value="0">0</button>
        <button class="data" value=".">.</button>
        <button class="data c3" value="=">=</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
