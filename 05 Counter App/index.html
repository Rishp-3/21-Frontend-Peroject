<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Counter</title>
  </head>
  <body>
    <div class="contener">
      <div class="con-text">
        <p>Current Count</p>
      </div>
      <div class="count">
        <h1 class="ans">0</h1>
      </div>
      <div class="btn">
        <button class="increment butt">+</button>
        <button class="reset butt">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="currentColor"
            class="bi bi-arrow-repeat"
            viewBox="0 0 16 16"
          >
            <path
              d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"
            ></path>
            <path
              fill-rule="evenodd"
              d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"
            ></path>
          </svg>
        </button>
        <button class="decrement butt">-</button>
      </div>
      <div class="btn">
        <button class="incres10 ">+10</button>
        <button class="decres10 ">-10</button>
      </div>
      <div class="data">
        <p>Total Clicks: <span class="total">0</span></p>
        <p>Highest: <span class="highest">0</span></p>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
