<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather</title>
  </head>
  <body>
    <header>
      <h1 class="headText">Weather</h1>
      <div class="error-box" role="alert" style="display:none"></div>
      <div class="search">
        <input
          class="cityInp"
          type="text"
          placeholder="Search Weather"
          name=""
        />
        <input class="submit" type="submit" value="Search" />
      </div>
    </header>
    <main>
      <div class="mainBox">
        <section class="sumInfo">
          <div class="">
            <div class="city"></div>
            <div class="dayTime"></div>
            <div class="temp"></div>
            <div class="description"></div>
          </div>
          <div class="icon">
            <img id="weatherIcon" alt="Weather icon" />
            <div class="feels"></div>
          </div>
        </section>
        <section class="main">
          <div class="sumBox">
            <div class="">
              <span class="">Humidity</span>
              <span class=""></span>
            </div>
            <div class="humidity"></div>
          </div>
          <div class="sumBox">
            <div class="">
              <span class="">Wind Speed</span>
              <span class=""></span>
            </div>
            <div class="windSpeed"></div>
          </div>
          <div class="sumBox">
            <div class="">
              <span class="">Pressure</span>
              <span class=""></span>
            </div>
            <div class="pressure"></div>
          </div>
          <div class="sumBox">
            <div class="">
              <span class="">Visibility</span>
              <span class=""></span>
            </div>
            <div class="visibility"></div>
          </div>
        </section>
        <section class="hourlyForecast">
          <div class="hfText">Hourly Forecast</div>
          <div class="hfData"></div>
        </section>
        <section class="weaklyForecast">
          <div class="wfText">5-Day Forecast</div>
          <div class="wfData"></div>
        </section>
      </div>
    </main>
    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
