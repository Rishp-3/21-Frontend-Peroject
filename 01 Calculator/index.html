<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="outr">
      <div class="mid">
        <div class="ans"></div>
        <div class="inner">
          <div class="ger1 gri">
            <button class="num" data-id="1" >1</button>
            <button class="num" data-id="2">2</button>
            <button class="num" data-id="3">3</button>
            <button class="num" data-id="+">+</button>
          </div>
          <div class="ger2 gri">
            <button class="num" data-id="4">4</button>
            <button class="num" data-id="5">5</button>
            <button class="num" data-id="6">6</button>
            <button class="num" data-id="-">-</button>
          </div>
          <div class="ger3 gri">
            <button class="num" data-id="7">7</button>
            <button class="num" data-id="8">8</button>
            <button class="num" data-id="9">9</button>
            <button class="num" data-id="x">x</button>
          </div>
          <div class="ger4 gri">
            <button class="num" data-id="0">0</button>
            <button class="num" data-id="c">c</button>
            <button class="num" data-id="/">/</button>
            <button class="num" data-id="=">=</button>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
