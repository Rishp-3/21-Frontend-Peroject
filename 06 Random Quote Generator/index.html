<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Random Quote Generator</title>
  </head>
  <body>
    <main class="box">
      <section class="inbox" aria-live="polite">
        <blockquote class="quote">Loading…</blockquote>
        <p class="author"></p>
        <div class="button-box">
          <button
            type="button"
            class="button"
            aria-label="Generate a new quote"
          >
            Generate Quote
          </button>
        </div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
