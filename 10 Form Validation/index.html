<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
  </head>
  <body>
    //header
    <header class="header">
      <div class="iconText">
        <span class="icon"></span><span class="text">Form Validation</span>
      </div>
      <div class=""></div>
    </header>
    //sum text
    <section id="topText">
      <h1>Create Your Account</h1>
      <p>Fill in Your Details Below</p>
    </section>
    //form input
    <section id="allInput">
      <div class="Name">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          name="fullName"
          id="fullName"
          placeholder="Enter Your Full Name"
        />
        <span class="fullNameCheck"></span>
      </div>
      <div class="emailBox">
        <label for="email">Email Address</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter Your Email"
        />
        <span class="emailCheck"></span>
      </div>
      <div class="passwordBox">
        <label for="password"></label
        ><input
          type="password"
          name="password"
          id="password"
          placeholder="Create Your password"
        />
        <div class=""></div>
        <div class="">.</div>
        <div class="">.</div>
      </div>
      <div class="">
        <label for="">password</label><input type="password" name="" id="" />
      </div>
      <div class=""></div>
      <div class=""></div>
      <div class=""></div>
    </section>
    <section id=""></section>
    <footer></footer>
  </body>
</html>
