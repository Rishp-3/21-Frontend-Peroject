<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Weather dashboard: current conditions, next 24 hours and 5-day forecast via OpenWeather."
    />
    <link rel="stylesheet" href="style.css" />
    <title>Weather</title>
  </head>
  <body>
    <header>
      <h1 class="headText">Weather</h1>
      <div class="error-box" role="alert" style="display: none"></div>
      <form class="search" id="searchForm">
        <label class="sr-only" for="cityInput">City name</label>
        <input
          id="cityInput"
          class="cityInp"
          type="text"
          placeholder="Search Weather"
          name="city"
          autocomplete="off"
        />
        <button class="submit" type="submit">Search</button>
      </form>
    </header>
    <main>
      <div class="mainBox">
        <section class="sumInfo">
          <div class="summary-head">
            <div class="city"></div>
            <div class="dayTime"></div>
            <div class="temp"></div>
            <div class="description"></div>
          </div>
          <div class="icon">
            <img id="weatherIcon" alt="Weather icon" width="64" height="64" />
            <div class="feels"></div>
          </div>
        </section>
        <section class="details" aria-label="Weather details">
          <div class="sumBox">
            <span class="sumLabel">Humidity</span>
            <div class="humidity"></div>
          </div>
          <div class="sumBox">
            <span class="sumLabel">Wind Speed</span>
            <div class="windSpeed"></div>
          </div>
          <div class="sumBox">
            <span class="sumLabel">Pressure</span>
            <div class="pressure"></div>
          </div>
          <div class="sumBox">
            <span class="sumLabel">Visibility</span>
            <div class="visibility"></div>
          </div>
        </section>
        <section class="hourlyForecast">
          <h2 class="hfText">Next 24 Hours (3-hour steps)</h2>
          <div class="hfData"></div>
        </section>
        <section class="dailyForecast">
          <h2 class="wfText">5-Day Forecast</h2>
          <div class="wfData"></div>
        </section>
      </div>
    </main>
    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
