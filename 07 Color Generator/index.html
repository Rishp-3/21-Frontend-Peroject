<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Color Generator</title>
  </head>
  <body>
    <header>
      <div class="headerBox">
        <span></span>
        <p>Color Generator</p>
      </div>
      <div class="headerText">
        <a href="https://www.instagram.com/rishp_3">Rishabh</a>
      </div>
    </header>
    <main>
      <div>
        <div class="mainText">
          <h1>Generate Beautiful Color</h1>
          <p></p>
        </div>
        <div class="genBut">
          <div></div>
          <div>
            <p>Current Color</p>
            <h2></h2>
          </div>
          <div><button>Generate New Color</button></div>
        </div>
        <div class="genData">
          <div class="curData">
            <span class=""> HEX Value </span>
            <span class=""></span>
            <span class="">Click Icon to Copy</span>
          </div>
          <div class="curData">
            <span class="">RGB Value</span>
            <span class=""></span>
            <span class="">Click Icon to Copy</span>
          </div>
          <div class="curData">
            <span class="">HSL Value</span>
            <span class=""></span>
            <span class="">Click Icon to Copy</span>
          </div>
          <div class="curData">
            <span class="">CMYK Value</span>
            <span class=""></span>
            <span class="">Click Icon to Copy</span>
          </div>
        </div>
      </div>
      <div class="recent">
        <div class="recText">
          <h2>Recent Color</h2>
        </div>
        <div class="recData">
          <div class="recDataBox">
            <span class="recColBox"></span><span class="recColVal"></span>
          </div>
          <div class="recDataBox">
            <span class="recColBox"></span><span class="recColVal"></span>
          </div>
          <div class="recDataBox">
            <span class="recColBox"></span><span class="recColVal"></span>
          </div>
          <div class="recDataBox">
            <span class="recColBox"></span><span class="recColVal"></span>
          </div>
          <div class="recDataBox">
            <span class="recColBox"></span><span class="recColVal"></span>
          </div>
          <div class="recDataBox">
            <span class="recColBox"></span><span class="recColVal"></span>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="About"></div>
      <div class="Format"></div>
      <div class="Tip"></div>
    </footer>
